<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AudioShelf</title>
<meta name="description" content="Your own audiobook shelf — self-hosted, offline-ready.">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AudioShelf">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/karla-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app" class="app" hidden></div>

<div id="boot" class="boot">
  <div class="boot__mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <p class="boot__label">AudioShelf</p>
</div>

<audio id="audio" preload="metadata" crossorigin="use-credentials"></audio>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
