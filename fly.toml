# Fly.io deployment. Adjust the app name and region, then:
#   fly launch --no-deploy --copy-config
#   fly volumes create audioshelf_data --size 20      # GB; sized for your library
#   fly deploy
#
# Getting audiobooks onto the volume:
#   fly ssh console -C "mkdir -p /data/library"
#   fly sftp shell            # then: put local-book.m4b /data/library/...
app = "audioshelf"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AUDIOSHELF_DATA = "/data"
  AUDIOSHELF_LIBRARY = "/data/library"
  AUDIOSHELF_PORT = "8080"
  AUDIOSHELF_TRUST_PROXY = "1"
  AUDIOSHELF_SCAN_INTERVAL_MIN = "60"

# One volume holds the library, the SQLite database and converted imports.
[[mounts]]
  source = "audioshelf_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Do not suspend: a sleeping machine drops in-flight audio streams.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
